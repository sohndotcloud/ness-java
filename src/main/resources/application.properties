spring.application.name=ness-backend

# --- Database ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

app.cors.allowed-origin=https://focus.sohn.cloud

server.port=${SERVER_PORT:5000}

# Hikari pool settings
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.minimum-idle=1

app.cookie.domain=sohn.cloud
ses.from-address=noreply@sohn.cloud
aws.region=us-east-2

signal.api.base-url=${SIGNAL_URL}